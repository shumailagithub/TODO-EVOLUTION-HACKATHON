name: Deploy to GKE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  CLUSTER_NAME: your-gke-cluster-name
  ZONE: your-gke-zone
  REGISTRY: gcr.io/${{ secrets.GKE_PROJECT }}/${{ github.event.repository.name }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.PROJECT_ID }}
        service_account_key: ${{ secrets.GKE_SA_KEY }}
        export_default_credentials: true

    - name: Setup kubectl
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: ${{ env.CLUSTER_NAME }}
        location: ${{ env.ZONE }}
        credentials: ${{ secrets.GKE_SA_KEY }}

    - name: Setup Docker
      uses: docker/setup-docker-action@v1

    - name: Configure Docker to use gcloud as a credential helper
      run: gcloud auth configure-docker

    - name: Build and push Docker image
      run: |
        docker build -t ${REGISTRY}:${GITHUB_SHA} .
        docker push ${REGISTRY}:${GITHUB_SHA}

    - name: Deploy to GKE
      run: |
        # Replace image in deployment files with the newly built image
        sed -i "s|IMAGE_PLACEHOLDER|${REGISTRY}:${GITHUB_SHA}|g" ./k8s/deployment.yaml
        
        # Apply Kubernetes manifests
        kubectl apply -f ./k8s/namespace.yaml
        kubectl apply -f ./k8s/
        
        # Wait for rollout to complete
        kubectl rollout status deployment/your-app-deployment -n your-app-namespace
        kubectl get services -n your-app-namespace