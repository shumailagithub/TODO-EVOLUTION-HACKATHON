apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-local
  namespace: default
  labels:
    app: kafka-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-local
  template:
    metadata:
      labels:
        app: kafka-local
    spec:
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:latest
        ports:
        - containerPort: 9092
        env:
        - name: KAFKA_BROKER_ID
          value: "1"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "localhost:2181"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://kafka-local:9092"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-local
  namespace: default
spec:
  selector:
    app: kafka-local
  ports:
    - protocol: TCP
      port: 9092
      targetPort: 9092
  type: ClusterIP