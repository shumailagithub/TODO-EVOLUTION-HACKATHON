apiVersion: v1
kind: Service
metadata:
  name: todo-backend-monitor
  namespace: default
  labels:
    app: todo-backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8001"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: todo-backend
  ports:
    - name: metrics
      port: 8001
      targetPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: todo-frontend-monitor
  namespace: default
  labels:
    app: todo-frontend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: todo-frontend
  ports:
    - name: metrics
      port: 3000
      targetPort: 3000