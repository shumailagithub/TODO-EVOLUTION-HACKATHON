# Default values for todo-app
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

backend:
  replicaCount: 1
  image:
    repository: todo-backend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 8001
  env:
    PORT: "8001"
    HOST: "127.0.0.1"
    DATABASE_URL: "postgresql://neondb_owner:npg_nh0FbJWZs7fz@ep-gentle-haze-ahf4luw8-pooler.c-3.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require"
    JWT_SECRET: "shumaila123shumaila123shumaila123"
    ACCESS_TOKEN_EXPIRE_MINUTES: "15"
    REFRESH_TOKEN_EXPIRE_DAYS: "7"
    OPENAI_API_KEY: "${OPENAI_API_KEY}"
    FALLBACK_PORTS: "8002,8003,8004"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

frontend:
  replicaCount: 1
  image:
    repository: todo-frontend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 3000
  env:
    NEXT_PUBLIC_API_URL: "http://todo-frontend-todo-app-backend:8001"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

probes:
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5

# Additional settings
nameOverride: ""
fullnameOverride: ""